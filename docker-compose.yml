# Local dev only. On OCI use the BYOL DB System and run the app image on OKE/Compute.
services:
  db:
    image: container-registry.oracle.com/database/free:latest
    environment:
      ORACLE_PWD: Oracle_123
    ports: ["1521:1521"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/setup/02_schema.sql:ro
      - ./db/local_user.sql:/docker-entrypoint-initdb.d/setup/01_user.sql:ro
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      ORACLE_USER: ooci
      ORACLE_PASSWORD: ooci
      ORACLE_CONNECT_STRING: db:1521/FREEPDB1
      BASE_DOMAIN: localhost
      ADMIN_TOKEN: dev
    depends_on: [db]
